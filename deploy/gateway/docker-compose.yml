# GATEWAY (ADR 0020, ADR 0025): the only part that talks to Meta. No sales logic and no AI model.
#   receive    the public webhook: verify the signature, store the raw request, queue it, answer 200 at once (NFR-1)
#   inbound    read what Meta sent and hand the agent clean events (it never sees Meta's wire format)
#   send       the only way out to Meta: replies, owner alerts, sign-in codes, and connecting a number for the web part.
#              Holds the WhatsApp tokens. Checks the 24-hour window and the per-number limit at the moment of sending
#   scheduler  this part's own timer: its raw-request log, and moving events along
#
#   scripts/stack.sh gateway          Scale one part:  scripts/stack.sh gateway --scale send=2
#
# Needs deploy/gateway/.env (copy .env.example). Start the database job (deploy/db) first.
# Only `receive` is published (127.0.0.1:8001); point your public tunnel or proxy for Meta at it.
# Each part is given only the secrets it uses (INV-11).
name: chatdeal-gateway

x-gateway: &gateway
  build: { context: ../../backend }
  image: ${BACKEND_IMAGE:-chatdeal-backend:local}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 20s
  environment: &gateway-env
    ENV: ${APP_ENV:?set APP_ENV in deploy/gateway/.env}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TRUST_PROXY: "true"
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/gateway/.env}
    PRICING_DATABASE_URL: ${PRICING_DATABASE_URL:?set PRICING_DATABASE_URL in deploy/gateway/.env}
    SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?set SYSTEM_DATABASE_URL in deploy/gateway/.env}
    MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in deploy/gateway/.env}
    QUEUE_BACKEND: ${QUEUE_BACKEND:-postgres}
    REDIS_URL: ${REDIS_URL:-}
    META_APP_ID: ${META_APP_ID:-}
    META_CONFIG_ID: ${META_CONFIG_ID:-}
    META_GRAPH_VERSION: ${META_GRAPH_VERSION:?set META_GRAPH_VERSION in deploy/gateway/.env}
    META_GRAPH_BASE: ${META_GRAPH_BASE:-https://graph.facebook.com}
    OTP_CHANNEL: ${OTP_CHANNEL:-whatsapp_cloud}
    PAYMENT_PROVIDER: manual            # production refuses `test`; the gateway never takes payments
    SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}

services:
  receive:
    <<: *gateway
    command: ["ingress"]
    ports: ["127.0.0.1:${RECEIVE_PORT:-8001}:8000"]
    environment:
      <<: *gateway-env
      META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET in deploy/gateway/.env}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?set META_VERIFY_TOKEN in deploy/gateway/.env}

  inbound:
    <<: *gateway
    command: ["worker"]
    environment:
      <<: *gateway-env
      WORKER_QUEUES: inbound.events
      WORKER_CONCURRENCY: ${INBOUND_CONCURRENCY:-8}

  send:
    <<: *gateway
    command: ["worker"]
    environment:
      <<: *gateway-env
      WORKER_QUEUES: outbound.actions
      WORKER_CONCURRENCY: ${SEND_CONCURRENCY:-8}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in deploy/gateway/.env}                   # opens each shop's WhatsApp token
      META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET in deploy/gateway/.env}   # completes Embedded Signup for the web part
      PLATFORM_SENDER_PHONE_NUMBER_ID: ${PLATFORM_SENDER_PHONE_NUMBER_ID:-sim-platform}  # the platform's own number: sign-in codes, and
      PLATFORM_WA_ACCESS_TOKEN: ${PLATFORM_WA_ACCESS_TOKEN:-}                            #   alerts when a shop's own number is down

  scheduler:
    <<: *gateway
    command: ["scheduler"]
    environment:
      <<: *gateway-env
      SCHEDULER_COMPONENT: gateway
