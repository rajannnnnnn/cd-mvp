# AI engine (production design): the workers that run the conversation turns (agent pipeline, reply checks, LLM calls).
# Its own compose project, so it scales and deploys on its own. It talks to the rest only through the database queue.
# Independent of the demo stack; it reuses only the backend project's image definition (backend.yml, same folder).
#
#   scripts\stack.ps1 ai -Scale 3        (or: docker compose --env-file .env -f ai-engine.yml up -d --scale ai-engine=3)
#
# Replicas are safe: the queue gives each conversation to one worker at a time (per-key ordering) and spreads claims across tenants.
# Throughput = replicas x AI_CONCURRENCY. Start the backend first: it runs the migrations.
name: chatdeal-ai

services:
  ai-engine:
    extends: { file: backend.yml, service: worker }
    depends_on: !reset {}
    environment:
      WORKER_QUEUES: conversation.events,conversation.turns
      WORKER_CONCURRENCY: ${AI_CONCURRENCY:-8}
