<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta simulator</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--ink:#111b21;--muted:#667781;--line:#e9edef;--me:#d9fdd3;--them:#fff;--chat:#efeae2;--accent:#00a884;--accent2:#008069;--blue:#53bdeb;--bad:#d93025;--warn:#b26a00;--code:#f6f8fa;--hover:#f5f6f6;--sel:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--panel:#111b21;--ink:#e9edef;--muted:#8696a0;--line:#222d34;--me:#005c4b;--them:#202c33;--chat:#0b141a;--accent:#00a884;--accent2:#25d366;--blue:#53bdeb;--bad:#f28b82;--warn:#fdd663;--code:#0d1418;--hover:#1a252c;--sel:#2a3942}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}.sub{font-size:12px;color:var(--muted)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--code);color:var(--muted);white-space:nowrap}.pill.ok{color:var(--accent)}.pill.bad{color:var(--bad)}
select,input,button,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer;transition:background .15s,border-color .15s,transform .05s}button:hover{background:var(--hover)}button:active{transform:scale(.97)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover{background:var(--accent2)}button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button.on{background:var(--accent);color:#fff}
/* who am I: the phone (or shop) bar */
#bar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;min-width:0}
.barlabel{font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.chips{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;flex:1;min-width:0;overflow-x:auto;padding:2px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-variant-numeric:tabular-nums;transition:all .2s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,168,132,.35)}
.chip .dot{min-width:17px;height:17px;border-radius:99px;background:var(--accent2);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}.chip.on .dot{background:#fff;color:var(--accent2)}
.addphone{display:flex;gap:6px;flex:none}.addphone input{width:170px;padding:4px 10px}.addphone button{padding:4px 10px}
main{display:grid;grid-template-columns:minmax(260px,320px) minmax(380px,1fr) 400px;flex:1;min-height:0}
@media (max-width:1100px){main{grid-template-columns:1fr;grid-auto-rows:minmax(420px,auto);overflow:auto}}
section{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.list{overflow:auto;flex:1}
.contact{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}.contact:hover{background:var(--hover)}.contact.sel{background:var(--sel)}
.av{width:40px;height:40px;border-radius:50%;background:#b0bcc3;color:#fff;display:grid;place-items:center;font-weight:600;flex:none;font-size:18px}.contact.sel .av,.hd .av.named{background:var(--accent)}
.contact .t{min-width:0;flex:1}.contact .n{font-weight:600;font-variant-numeric:tabular-nums}.contact .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.contact .row1,.contact .row2{display:flex;gap:6px;justify-content:space-between;align-items:center}.contact .when{font-size:11px;color:var(--muted)}.contact .when.new{color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:99px;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:600;display:grid;place-items:center;animation:pop .25s ease-out}
.contact .l.unread{font-weight:600;color:var(--ink)}
/* the conversation */
#strip{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--code);border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
#strip b{font-variant-numeric:tabular-nums}#strip .arrow{color:var(--muted)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}.who .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who .ph{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.who .st{font-size:12px;color:var(--accent);font-weight:600;min-height:16px}
#chat{background:var(--chat);overflow:auto;flex:1;padding:14px 8%;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
#chat.swap{animation:fade .22s ease-out}
.b{max-width:78%;padding:6px 9px 4px;border-radius:9px;background:var(--them);box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;white-space:pre-wrap;position:relative}
.b.new{animation:pop .22s ease-out}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:2px}.b.them{align-self:flex-start;border-top-left-radius:2px}
.b .meta{font-size:11px;color:var(--muted);margin-top:1px;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.tick{letter-spacing:-3px;transition:color .4s}.tick.read{color:var(--blue)}.tick.pend{letter-spacing:0}.fail{color:var(--bad)}.tag{background:var(--code);border-radius:4px;padding:0 4px}
.lat{align-self:flex-start;font-size:11px;color:var(--muted);margin:-1px 0 5px 4px}.sep{align-self:center;font-size:11.5px;color:var(--muted);background:var(--panel);border-radius:8px;padding:2px 10px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.dots{display:inline-flex;gap:4px;padding:6px 4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.copybtn{margin-top:4px;font-size:12px}
.composer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.composer input#msg{flex:1;min-width:140px;border-radius:99px;padding:8px 14px}
#otpbar{padding:8px 12px;background:#fff8e1;color:#4a3b00;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media (prefers-color-scheme:dark){#otpbar{background:#3a3000;color:#fff3c4}}
#otpbar b{font-size:20px;letter-spacing:3px;font-variant-numeric:tabular-nums}
.welcome{margin:auto;max-width:460px;background:var(--panel);border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,0,0,.12)}.welcome h2{margin:0 0 6px;font-size:17px}.welcome ol{margin:8px 0 0 18px;padding:0}.welcome li{margin:6px 0}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:320px}
/* the QA tools */
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 4px;color:var(--muted);font-size:13px}.tabs button.on{color:var(--ink);border-bottom:2px solid var(--accent);font-weight:600}
.pane{overflow:auto;flex:1;padding:8px;scroll-behavior:smooth}.explain{font-size:12.5px;color:var(--muted);background:var(--code);border-radius:8px;padding:7px 9px;margin-bottom:8px}
.ev{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden}.ev>div{padding:5px 8px;display:flex;gap:8px;cursor:pointer;align-items:center;flex-wrap:wrap}
.ev .d{font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--code)}.ev pre{margin:0;padding:8px;background:var(--code);font-size:11px;overflow:auto;max-height:260px;display:none}.ev.open pre{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600}
label.f{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;font-size:12px;color:var(--muted)}label.f input{color:var(--ink)}.row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}h3{margin:14px 0 6px;font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#111b21;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:20}#toast.on{opacity:.94;transform:translate(-50%,0)}
dialog{border:0;border-radius:14px;max-width:640px;width:92vw;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:18px 22px;max-height:80vh;overflow:auto}dialog h2{margin:0 0 8px}dialog dt{font-weight:600;margin-top:8px}dialog dd{margin:2px 0 0 0;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:.2;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Meta simulator</h1><span class="sub">a stand-in for WhatsApp and Meta, for testing the product</span>
  <div class="seg" id="view"><button data-v="phone" class="on" title="You hold a customer's mobile phone and chat with shops">📱 Customer phones</button><button data-v="biz" title="You are the shop owner: see the shop's customers">🏪 Shop side</button></div>
  <span id="live" class="pill">connecting…</span><span id="hook" class="pill"></span>
  <span style="flex:1"></span><button id="help">❓ How this works</button><button id="reset" title="Delete every message in the simulator">Clear all chats</button>
</header>
<div id="bar"></div>
<main>
  <section id="left"><div class="hd" id="listhd"></div><div class="list" id="chats"></div><div class="hd" id="newchat"></div></section>
  <section>
    <div id="strip"></div>
    <div class="hd"><div class="av" id="cav">?</div><div class="who"><div class="nm" id="cname">Pick a chat</div><div class="ph" id="cnum"></div><div class="st" id="cstat"></div></div>
      <button id="savec" hidden>Save contact</button>
      <div class="seg" id="role" hidden><button data-r="customer" class="on" title="Type as the customer, from the customer's phone">As the customer</button><button data-r="owner" title="Type as the shop owner, from the WhatsApp Business app (the product sees an echo)">As the shop owner</button></div></div>
    <div id="otpbar" hidden><span>🔑 Latest sign-in code on this phone:</span><b id="otpcode"></b><button id="otpcopy">Copy</button><span class="hint" id="otpwhen"></span></div>
    <div id="chat"></div>
    <div class="composer"><input id="msg" placeholder="Type a message" autocomplete="off"><button class="primary" id="send">Send</button>
      <button id="voice" title="Send a voice note (pick an audio file)">🎤</button><button id="photo" title="Send a photo (pick an image)">📷</button><input type="file" id="pick" hidden><button id="frag" title="Send three short messages 2 seconds apart, like a customer typing in bursts">3 fragments</button></div>
  </section>
  <section style="border-right:0">
    <div class="tabs" id="tabs"><button class="on" data-p="wire" title="Everything sent between this simulator and the product">Activity log</button><button data-p="timing" title="How fast the product answered">Reply speed</button><button data-p="audit" title="A summary and a table for the selected phone">Report</button><button data-p="set" title="Make things go wrong, connection settings">Test controls</button></div>
    <div class="pane" id="p-wire"></div><div class="pane" id="p-audit" hidden></div><div class="pane" id="p-timing" hidden></div><div class="pane" id="p-set" hidden></div>
  </section>
</main>
<div id="toast"></div>
<dialog id="helpdlg"><div class="in" id="helpbody"></div></dialog>
<script>
const S={biz:[],customers:{},msgs:new Map(),wire:[],settings:{},typing:{},pnid:null,cust:null,role:'customer',tab:'wire',view:'phone',pending:[],drawn:new Set(),threadKey:'',follow:true};
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
S.saved=LS('sim.saved',{}); S.seen=LS('sim.seen',{});            // like a real phone: the contacts you saved, and what you have already opened
const $=s=>document.querySelector(s), el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const api=(p,b)=>fetch('/sim/api/'+p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const fmt=t=>new Date(t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
const hm=t=>new Date(t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const sec=(a,b)=>((b-a)).toFixed(1)+' s';
const digits=s=>String(s||'').replace(/\D/g,'');
const num=d=>{d=digits(d);return d.length===12&&d.startsWith('91')?'+91 '+d.slice(2,7)+' '+d.slice(7):'+'+d};
const clock=t=>{const d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?hm(t):d.toLocaleDateString([],{day:'2-digit',month:'short'})};
const shops=()=>S.biz.filter(b=>b.kind==='business');
const bizOf=pn=>S.biz.find(b=>b.pnid===pn)||{name:'?',display:'',kind:'business',pnid:pn};
const skey=(wa,b)=>wa+'|'+digits(b.display);                      // a saved contact belongs to one phone
const saved=b=>S.saved[skey(S.cust,b)];                          // the name this phone gave that number, if any
const label=b=>saved(b)||num(b.display);
const msgsOf=(pn,wa)=>[...S.msgs.values()].filter(m=>m.pnid===pn&&m.customer===wa).sort((a,b)=>a.ts-b.ts);
const thread=()=>msgsOf(S.pnid,S.cust);
const toPhone=m=>m.direction!=='in';
const unreadOf=(wa,b)=>[...S.msgs.values()].filter(m=>m.pnid===b.pnid&&m.customer===wa&&toPhone(m)&&m.ts>(S.seen[wa+'|'+b.pnid]||0)).length;
const unreadPhone=wa=>S.biz.reduce((a,b)=>a+unreadOf(wa,b),0);
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),1900)}

/* ---------------------------------------------------------------- switching: the phone (who is holding it) and the chat (who it is talking to) */
function bestChat(wa){                                          // the chat with the newest message on that phone, else the first shop
  const rows=S.biz.map(b=>({b,l:msgsOf(b.pnid,wa).slice(-1)[0]})).filter(r=>r.l).sort((x,y)=>y.l.ts-x.l.ts);
  return rows.length?rows[0].b.pnid:(shops()[0]||S.biz[0]||{}).pnid}
function pickPhone(wa){
  if(!wa||S.cust===wa)return;S.cust=wa;S.pnid=bestChat(wa);S.pending=[];toast('📱 Now holding the phone '+num(wa));renderAll()}
function pickChat(pn){
  if(S.pnid===pn)return;S.pnid=pn;toast('💬 Opened the chat with '+label(bizOf(pn)));renderAll()}
function pickShop(pn){
  if(S.pnid===pn)return;S.pnid=pn;const ws=Object.keys(S.customers).map(w=>({w,l:msgsOf(pn,w).slice(-1)[0]})).sort((a,b)=>(b.l?b.l.ts:0)-(a.l?a.l.ts:0));
  S.cust=ws.length?ws[0].w:null;toast('🏪 Now the shop '+num(bizOf(pn).display));renderAll()}
function pickCustomer(wa){if(S.cust===wa)return;S.cust=wa;toast('💬 Opened the chat with '+num(wa));renderAll()}

/* ---------------------------------------------------------------- the bar: which phone / which shop */
function renderBar(){
  const bar=$('#bar');bar.innerHTML='';const phone=S.view==='phone';
  bar.appendChild(el('div','barlabel',phone?'📱 You are holding:':'🏪 You are the shop:'));
  const chips=el('div','chips');
  if(phone){Object.keys(S.customers).forEach(wa=>{const c=el('button','chip'+(wa===S.cust?' on':''),num(wa));const n=unreadPhone(wa)-(wa===S.cust?unreadOf(wa,bizOf(S.pnid)):0);
      if(n>0)c.appendChild(el('span','dot',String(n)));c.title='Switch to this mobile phone';c.onclick=()=>pickPhone(wa);chips.appendChild(c)})}
  else shops().forEach(b=>{const c=el('button','chip'+(b.pnid===S.pnid?' on':''),num(b.display));c.title=b.name;c.onclick=()=>pickShop(b.pnid);chips.appendChild(c)});
  bar.appendChild(chips);
  if(phone){const a=el('div','addphone');const i=el('input');i.id='newwa';i.placeholder='＋ add phone: +91 98765 43210';const b=el('button',null,'Add phone');
    const add=async()=>{const v=i.value.trim();if(!v)return;await api('customers',{wa_id:v});const wa=digits(v);i.value='';setTimeout(()=>pickPhone(wa),250)};
    b.onclick=add;i.onkeydown=e=>{if(e.key==='Enter')add()};a.append(i,b);bar.appendChild(a)}}

/* ---------------------------------------------------------------- the list: chats on this phone / customers of this shop */
function renderList(){
  const box=$('#chats'),hd=$('#listhd'),nc=$('#newchat');box.innerHTML='';hd.innerHTML='';nc.innerHTML='';
  const phone=S.view==='phone';
  if(!S.cust&&phone){hd.appendChild(el('b',null,'Chats'));box.appendChild(el('div','empty','Add a phone above to start.'));return}
  hd.appendChild(el('b',null,phone?'💬 Chats on '+num(S.cust):'💬 Customers of '+num(bizOf(S.pnid).display)));
  if(phone){
    const rows=S.biz.map(b=>({b,last:msgsOf(b.pnid,S.cust).slice(-1)[0]})).sort((x,y)=>(y.last?y.last.ts:0)-(x.last?x.last.ts:0));
    rows.forEach(({b,last})=>{const n=b.pnid===S.pnid?0:unreadOf(S.cust,b),sv=saved(b);const c=el('div','contact'+(b.pnid===S.pnid?' sel':''));
      c.appendChild(el('div','av',sv?sv[0].toUpperCase():'👤'));const t=el('div','t'),r1=el('div','row1'),r2=el('div','row2');
      r1.appendChild(el('div','n',label(b)));if(last)r1.appendChild(el('div','when'+(n?' new':''),clock(last.ts)));
      const l=el('div','l'+(n?' unread':''),last?((last.direction==='in'?'✓ ':'')+last.text):'Tap to start chatting');r2.appendChild(l);if(n)r2.appendChild(el('div','badge',String(n)));
      t.append(r1);if(sv)t.append(el('div','l',num(b.display)));t.append(r2);c.appendChild(t);c.onclick=()=>pickChat(b.pnid);box.appendChild(c)});
    const inp=el('input');inp.placeholder='＋ Chat with any number: +91 97000 00001';inp.style.flex='1';inp.setAttribute('list','numlist');
    const dl=el('datalist');dl.id='numlist';S.biz.forEach(b=>{const o=el('option');o.value=num(b.display);dl.appendChild(o)});
    const go=el('button',null,'Open');
    const open=()=>{const d=digits(inp.value);if(!d)return;const hit=S.biz.find(b=>digits(b.display)===d||(d.length>=10&&digits(b.display).endsWith(d.slice(-10))));
      if(hit){inp.value='';pickChat(hit.pnid)}else toast('No WhatsApp number in the simulator is '+num(d)+'. Numbers you can chat with: '+S.biz.map(b=>num(b.display)).join(', '))};
    go.onclick=open;inp.onkeydown=e=>{if(e.key==='Enter')open()};nc.append(inp,go,dl)}
  else{
    const rows=Object.entries(S.customers).map(([wa,name])=>({wa,name,last:msgsOf(S.pnid,wa).slice(-1)[0]})).sort((x,y)=>(y.last?y.last.ts:0)-(x.last?x.last.ts:0));
    rows.forEach(({wa,name,last})=>{const c=el('div','contact'+(wa===S.cust?' sel':''));c.appendChild(el('div','av',(name&&name!==wa?name:'👤')[0]));const t=el('div','t'),r1=el('div','row1'),r2=el('div','row2');
      r1.appendChild(el('div','n',name&&name!==wa?name:num(wa)));if(last)r1.appendChild(el('div','when',clock(last.ts)));
      r2.appendChild(el('div','l',last?((last.direction==='in'?'':'↩ ')+last.text):'no messages yet'));if(name&&name!==wa)t.appendChild(el('div','l',num(wa)));
      t.append(r1,r2);c.appendChild(t);c.onclick=()=>pickCustomer(wa);box.appendChild(c)})}}

/* ---------------------------------------------------------------- the conversation header: ALWAYS says which phone and who it is talking to */
function renderHeader(){
  const phone=S.view==='phone',strip=$('#strip');strip.innerHTML='';
  const sb=$('#savec'),role=$('#role');
  if(!S.cust||!S.pnid){$('#cname').textContent='Pick a chat';$('#cnum').textContent='';$('#cstat').textContent='';$('#cav').textContent='?';$('#cav').className='av';sb.hidden=true;role.hidden=true;return}
  const b=bizOf(S.pnid);
  if(phone){
    strip.append(el('span',null,'📱 This phone:'),Object.assign(el('b'),{textContent:num(S.cust)}),el('span','arrow','➜'),el('span',null,'💬 talking to:'),Object.assign(el('b'),{textContent:num(b.display)}));
    const sv=saved(b);$('#cname').textContent=sv||num(b.display);$('#cnum').textContent=sv?num(b.display)+' · saved contact':num(b.display)+' · not in your contacts';   // the number is always shown, even for a saved contact
    $('#cav').textContent=sv?sv[0].toUpperCase():'👤';$('#cav').className='av'+(sv?' named':'');
    sb.hidden=false;sb.textContent=sv?'Edit contact':'Save contact';

async function load(){
  const st=await api('state');S.biz=st.businesses;S.customers=st.customers;S.wire=st.wire.slice();S.settings=st.settings;
  S.typing=Object.fromEntries(Object.entries(st.typing));S.msgs=new Map(st.messages.map(m=>[m.id,m]));
  if(!S.pnid||!S.biz.find(b=>b.pnid===S.pnid))S.pnid=(shops()[0]||S.biz[0]||{}).pnid;
  if(S.view==='phone'&&!S.cust){const f=Object.keys(S.customers)[0];if(f){S.cust=f;S.pnid=bestChat(f)}}
  renderAll();renderHelp();if(!LS('sim.welcomed',false)){SV('sim.welcomed',true);if(!S.cust)return}}
function connect(){
  const es=new EventSource('/sim/api/events');
  es.onopen=()=>{$('#live').textContent='● live';$('#live').className='pill ok'};
  es.onerror=()=>{$('#live').textContent='reconnecting…';$('#live').className='pill bad'};
  es.onmessage=e=>{const {type,data}=JSON.parse(e.data);
    if(type==='message'){S.msgs.set(data.id,data);
      if(data.direction==='in'){const i=S.pending.findIndex(p=>p.pnid===data.pnid&&p.customer===data.customer&&p.text===data.text);if(i>=0)S.pending.splice(i,1)}
      renderChat();renderList();renderBar();renderOtp();renderTiming();if(S.tab==='audit')renderAudit()}
    else if(type==='wire'){S.wire.push(data);if(S.wire.length>300)S.wire.shift();renderWire()}
    else if(type==='customers'){S.customers=data;if(S.view==='phone'&&!S.cust){const f=Object.keys(data)[0];if(f){S.cust=f;S.pnid=bestChat(f)}}renderAll()}
    else if(type==='businesses'){S.biz=data;renderAll()}
    else if(type==='settings'){S.settings=data;renderSettings()}
    else if(type==='typing'){S.typing[data.pnid+'|'+data.customer]=data.until;renderTyping()}
    else if(type==='reset'){S.msgs.clear();S.wire=[];S.pending=[];S.drawn=new Set();renderAll()}};
}
async function send(kind){
  if(!S.cust||!S.pnid)return;const text=$('#msg').value.trim();if(kind==='text'&&!text)return;$('#msg').value='';
  if(S.view==='biz'&&S.role==='owner'){await api('owner/send',{pnid:S.pnid,customer:S.cust,text});return}
  const p={pnid:S.pnid,customer:S.cust,text,ts:Date.now()};S.pending.push(p);renderChat();                       // appears at once with a clock, like a real phone
  try{await api('customer/send',{pnid:S.pnid,customer:S.cust,kind,text:kind==='text'?text:(kind==='audio'?'🎤 voice note':'📷 photo')})}
  catch(e){p.failed=true;renderChat()}
  setTimeout(()=>{const i=S.pending.indexOf(p);if(i>=0){S.pending.splice(i,1);renderChat()}},6000)}

$('#reset').onclick=()=>{if(confirm('Delete every message in the simulator?'))api('reset',{})};
$('#help').onclick=()=>{renderHelp();$('#helpdlg').showModal()};
$('#view').onclick=e=>{const v=e.target.dataset.v;if(!v||v===S.view)return;S.view=v;[...$('#view').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='phone'){S.role='customer';if(!S.cust){const f=Object.keys(S.customers)[0];if(f){S.cust=f;}}if(S.cust)S.pnid=bestChat(S.cust);toast('📱 Customer phones: you are holding a customer’s mobile')}
  else{const sh=shops();if(!sh.find(b=>b.pnid===S.pnid))S.pnid=(sh[0]||{}).pnid;const ws=Object.keys(S.customers).map(w=>({w,l:msgsOf(S.pnid,w).slice(-1)[0]})).sort((a,b)=>(b.l?b.l.ts:0)-(a.l?a.l.ts:0));S.cust=ws.length?ws[0].w:S.cust;toast('🏪 Shop side: you are the shop owner')}
  renderAll()};
$('#otpcopy').onclick=()=>{const o=otpLatest();if(o&&navigator.clipboard)navigator.clipboard.writeText(o.code)};
$('#role').onclick=e=>{const r=e.target.dataset.r;if(!r)return;S.role=r;[...$('#role').children].forEach(b=>b.classList.toggle('on',b.dataset.r===r));toast(r==='owner'?'🏪 Typing as the shop owner (WhatsApp Business app)':'👤 Typing as the customer');renderChat()};
$('#tabs').onclick=e=>{const p=e.target.dataset.p;if(!p)return;S.tab=p;if(p==='audit')renderAudit();[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.p===p));['wire','timing','audit','set'].forEach(x=>$('#p-'+x).hidden=x!==p);if(p==='wire'){const w=$('#p-wire');w.scrollTop=w.scrollHeight}};
setInterval(()=>{if(S.cust&&S.pnid)renderTyping()},1000);
load().then(connect);
</script>
</body>
</html>
