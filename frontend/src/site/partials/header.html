<header id="top" class="sticky top-0 z-40 border-b border-line/60 bg-bg/80 backdrop-blur-lg">
  <div class="mx-auto flex max-w-[1180px] items-center gap-4 px-4 py-3 lg:px-8">
    <a href="/" class="flex items-center gap-2.5 font-display text-[20px] font-extrabold tracking-tight" aria-label="{{brand}} home">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-white shadow-[0_8px_18px_-8px_rgb(var(--brand))]">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12Z"/><path d="m9 11.5 2 2 4-4"/></svg>
      </span>{{brand}}
    </a>
    <nav class="ml-6 hidden items-center gap-1 text-[14.5px] font-semibold text-muted lg:flex" aria-label="Main">
      <a class="rounded-lg px-3 py-2 hover:bg-surface2 hover:text-ink" href="/#how" data-i18n="nav.how">How it works</a>
      <a class="rounded-lg px-3 py-2 hover:bg-surface2 hover:text-ink" href="/#control" data-i18n="nav.control">Your price limits</a>
      <a class="rounded-lg px-3 py-2 hover:bg-surface2 hover:text-ink" href="/#features" data-i18n="nav.features">Features</a>
      <a class="rounded-lg px-3 py-2 hover:bg-surface2 hover:text-ink" href="/pricing" data-i18n="nav.pricing">Pricing</a>
      <a class="rounded-lg px-3 py-2 hover:bg-surface2 hover:text-ink" href="/#faq" data-i18n="nav.faq">Questions</a>
    </nav>
    <div class="ml-auto flex items-center gap-1.5">
      <button id="theme-toggle" class="btn btn-ghost btn-icon hidden sm:inline-flex" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
      <a href="/app/login" class="btn btn-outline btn-sm" data-i18n="nav.login">Log in</a>
      <a href="/app/login?src=header" class="btn btn-primary btn-sm" data-cta><span class="sm:hidden">Try free</span><span class="hidden sm:inline" data-i18n="nav.trial">Start free trial</span></a>
      <button id="menu-toggle" class="btn btn-ghost btn-icon lg:hidden" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <nav id="mobile-menu" class="hidden border-t border-line/60 bg-bg px-4 pb-5 pt-3 lg:hidden" aria-label="Menu">
    <a class="block rounded-xl px-3 py-3 text-[16px] font-semibold hover:bg-surface2" href="/#how">How it works</a>
    <a class="block rounded-xl px-3 py-3 text-[16px] font-semibold hover:bg-surface2" href="/#control">Your price limits</a>
    <a class="block rounded-xl px-3 py-3 text-[16px] font-semibold hover:bg-surface2" href="/#features">Features</a>
    <a class="block rounded-xl px-3 py-3 text-[16px] font-semibold hover:bg-surface2" href="/pricing">Pricing</a>
    <a class="block rounded-xl px-3 py-3 text-[16px] font-semibold hover:bg-surface2" href="/#faq">Questions</a>
    <div class="mt-3 grid gap-2.5">
      <button type="button" id="theme-toggle-m" class="btn btn-outline btn-lg w-full">Switch light / dark</button>
    </div>
  </nav>
</header>
