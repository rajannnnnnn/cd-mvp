[project]
name = "salesai"
version = "0.1.0"
description = "WhatsApp AI Sales Assistant backend (modular monolith, multiple process roles)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "redis>=5.2",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  "anthropic>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "S311", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
# Package roots (modules/*/__init__.py) ARE the public interfaces that scripts/check_boundaries.py enforces,
# so re-exporting from them is intentional.
implicit_reexport = true
warn_unused_ignores = true

# Data-access code reads SQL result rows (dict | None). Aggregate queries always return a row, so indexing the
# result directly is accepted there; the pure domain code (pricing engine, rules, queue/event contracts) stays
# fully strict. See docs/decisions/0010-static-checks.md.
[[tool.mypy.overrides]]
module = [
  "salesai.modules.*.service", "salesai.modules.*.repo", "salesai.modules.*.lifecycle", "salesai.modules.*.inbound",
  "salesai.modules.*.turns", "salesai.modules.*.sender", "salesai.modules.*.context", "salesai.modules.*.pipeline",
  "salesai.modules.*.policy", "salesai.modules.*.ingress", "salesai.api.*", "salesai.seed", "salesai.runtime",
  "salesai.scheduler", "salesai.ratelimit", "salesai.queue.postgres", "salesai.events.*",
]
disable_error_code = ["index", "union-attr"]
warn_return_any = false

# Demo-data loader: development tooling, not product logic.
[[tool.mypy.overrides]]
module = ["salesai.seed"]
ignore_errors = true
