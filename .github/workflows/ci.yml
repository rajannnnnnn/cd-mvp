name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, boundaries, tests on Postgres queue)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Types
        run: uv run mypy src
      - name: Module boundaries (seams from "Built for change")
        run: uv run python scripts/check_boundaries.py
      - name: Tests (invariants, tenant isolation, queue, pricing properties, conversations, API)
        run: uv run pytest -q
      - name: OpenAPI contract is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  backend-redis:
    name: backend (async pipeline on the Redis queue backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_QUEUE_BACKEND: redis
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q tests/test_queue_redis.py tests/test_inbound.py tests/test_conversation_flow.py tests/test_owner_loop.py tests/test_scheduler.py tests/test_api.py tests/test_auth.py

  frontend:
    name: frontend (types, unit tests, build, generated client is current)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - name: Generated API client matches the backend contract
        run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: containers (compose file valid, images build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          printf 'POSTGRES_PASSWORD=a\nAPP_OWNER_PASSWORD=a\nAPP_USER_PASSWORD=a\nAPP_PRICING_PASSWORD=a\nAPP_SYSTEM_PASSWORD=a\nMASTER_KEY=a\nJWT_SECRET=a\nOTP_SECRET=a\nMETA_APP_SECRET=a\nMETA_VERIFY_TOKEN=a\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build

  e2e:
    name: end-to-end (full stack in containers, browser tests)
    runs-on: ubuntu-latest
    needs: [compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start the stack with demo data
        run: scripts/up.sh --demo
      - name: Wait for the web container
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 2; done; docker compose -f deploy/docker-compose.yml logs; exit 1
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npx playwright test
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -300
